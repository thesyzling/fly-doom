[project]
name = "fly-doom"
version = "0.1.0"
description = "Connectome-constrained Doom research experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "pyarrow>=18", "vizdoom>=1.2.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
training = ["laya==0.3.21", "torch>=2.0", "safetensors>=0.4", "pygame-ce>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
